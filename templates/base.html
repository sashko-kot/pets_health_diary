{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Дневник здоровья грызунов{% endblock %}</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="{% static 'homepage/css/style.css' %}"
        rel="stylesheet"
    >
</head>
<body>
    {% include "includes/navigation.html" %}
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer mt-5 py-4">
        <div class="container d-flex justify-content-between flex-wrap gap-2">
            <span>Дневник здоровья грызунов</span>
            <span>© {% now "Y" %}</span>
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
</body>
</html>
